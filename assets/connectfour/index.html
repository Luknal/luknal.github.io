<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect Four — Daniel Li</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#4a76ee; --blue-dark:#0c0cf2; --bg:#f3f5fb; --text:#1a1c20;
    --p1:#e63946; --p2:#ffd166; --empty:#ffffff; --muted:#6b7280;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--text);
    display:flex;flex-direction:column;align-items:center;padding:18px 12px 24px;
  }
  h1{font-size:22px;margin:0 0 10px;font-weight:600;}
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;margin-bottom:12px;}
  .seg{display:inline-flex;border:2px solid var(--blue);border-radius:10px;overflow:hidden;}
  .seg button{border:none;border-radius:0;padding:6px 14px;background:#fff;color:var(--blue);
              font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;transition:.15s;}
  .seg button.active{background:var(--blue);color:#fff;}
  #reset{font-family:inherit;font-size:14px;font-weight:600;padding:6px 14px;border-radius:10px;
         border:2px solid var(--blue);background:#fff;color:var(--blue);cursor:pointer;transition:.15s;}
  #reset:hover{background:var(--blue);color:#fff;}
  .status{font-weight:600;font-size:18px;min-height:26px;margin-bottom:12px;text-align:center;
          display:flex;align-items:center;gap:8px;}
  .dot{width:16px;height:16px;border-radius:50%;display:inline-block;box-shadow:0 0 0 2px rgba(0,0,0,.08) inset;}
  .dot.p1{background:var(--p1);} .dot.p2{background:var(--p2);}
  .board{
    background:var(--blue);padding:10px;border-radius:18px;display:grid;
    grid-template-columns:repeat(7,1fr);gap:8px;width:min(94vw,440px);
    box-shadow:0 8px 20px rgba(74,118,238,.25);
  }
  .cell{
    aspect-ratio:1/1;background:var(--empty);border-radius:50%;cursor:pointer;
    transition:background .12s; position:relative;
  }
  .cell.p1{background:var(--p1);}
  .cell.p2{background:var(--p2);}
  .cell.preview{box-shadow:0 0 0 4px rgba(255,255,255,.55) inset;}
  .cell.win{box-shadow:0 0 0 4px var(--blue-dark) inset, 0 0 12px var(--blue-dark);}
  .cell.drop{animation:drop .28s cubic-bezier(.34,1.3,.7,1);}
  @keyframes drop{from{transform:translateY(-360%);}to{transform:none;}}
  .board.over .cell{cursor:default;}
  .foot{margin-top:14px;font-size:12.5px;color:var(--muted);text-align:center;max-width:440px;line-height:1.5;}
</style>
</head>
<body>
  <h1>Connect Four</h1>
  <div class="controls">
    <span class="seg" id="mode">
      <button data-mode="cpu" class="active">vs Computer</button>
      <button data-mode="pvp">2 Players</button>
    </span>
    <button id="reset">Reset</button>
  </div>
  <div class="status" id="status"></div>
  <div class="board" id="board" aria-label="Connect Four board"></div>
  <div class="foot">Click a column to drop your disc. First to line up four — horizontally, vertically, or diagonally — wins.</div>

<script>
(function(){
  const ROWS = 6, COLS = 7, GOAL = 4;
  const P1 = 1, P2 = 2;               // P1 = red (you), P2 = yellow (computer / player 2)
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  let board, current, over, mode = 'cpu', cells = [], locked = false;

  function newGame(){
    board = Array.from({length:ROWS}, () => Array(COLS).fill(0));
    current = P1; over = false; locked = false;
    render();
    setStatus();
  }

  function render(){
    boardEl.innerHTML = '';
    boardEl.classList.remove('over');
    cells = [];
    for(let r=0;r<ROWS;r++){
      const rowCells = [];
      for(let c=0;c<COLS;c++){
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.col = c;
        cell.addEventListener('click', () => onColumn(c));
        cell.addEventListener('mouseenter', () => preview(c, true));
        cell.addEventListener('mouseleave', () => preview(c, false));
        boardEl.appendChild(cell);
        rowCells.push(cell);
      }
      cells.push(rowCells);
    }
  }

  function paint(r,c,player,drop){
    const cell = cells[r][c];
    cell.classList.remove('preview');
    cell.classList.add(player===P1 ? 'p1' : 'p2');
    if(drop) cell.classList.add('drop');
  }

  function lowestEmpty(c){
    for(let r=ROWS-1;r>=0;r--) if(board[r][c]===0) return r;
    return -1;
  }

  function preview(c, on){
    if(over || locked) return;
    const r = lowestEmpty(c);
    if(r<0) return;
    cells[r][c].classList.toggle('preview', on);
  }

  function setStatus(){
    if(over) return;
    const who = (mode==='cpu' && current===P2) ? 'Computer' : 'Player ' + current;
    statusEl.innerHTML = '<span class="dot '+(current===P1?'p1':'p2')+'"></span>' + who + "'s turn";
  }

  function onColumn(c){
    if(over || locked) return;
    if(mode==='cpu' && current===P2) return;   // wait for computer
    drop(c, current);
  }

  function drop(c, player){
    const r = lowestEmpty(c);
    if(r<0) return false;
    board[r][c] = player;
    paint(r,c,player,true);

    const win = winningCells(r,c);
    if(win){ endGame(player, win); return true; }
    if(isFull()){ endDraw(); return true; }

    current = (player===P1) ? P2 : P1;
    setStatus();

    if(mode==='cpu' && current===P2 && !over){
      locked = true;
      setTimeout(() => { const col = computerMove(); drop(col, P2); locked = false; }, 420);
    }
    return true;
  }

  function isFull(){ return board[0].every(v => v!==0); }

  // Mirrors the Java checkWin(r,c,dr,dc): counts a run through (r,c) in a direction.
  function run(r,c,dr,dc,player){
    const list=[];
    let rr=r, cc=c;
    while(rr>=0&&rr<ROWS&&cc>=0&&cc<COLS&&board[rr][cc]===player){ list.push([rr,cc]); rr+=dr; cc+=dc; }
    return list;
  }
  function winningCells(r,c){
    const player = board[r][c];
    const dirs = [[0,1],[1,0],[1,1],[1,-1]];
    for(const [dr,dc] of dirs){
      const line = run(r,c,dr,dc,player).concat(run(r,c,-dr,-dc,player).slice(1));
      if(line.length>=GOAL) return line;
    }
    return null;
  }

  function endGame(player, win){
    over = true; locked = false;
    boardEl.classList.add('over');
    win.forEach(([r,c]) => cells[r][c].classList.add('win'));
    const who = (mode==='cpu') ? (player===P1 ? 'You win! 🎉' : 'Computer wins')
                               : 'Player ' + player + ' wins! 🎉';
    statusEl.innerHTML = '<span class="dot '+(player===P1?'p1':'p2')+'"></span>' + who;
  }
  function endDraw(){
    over = true; locked = false;
    boardEl.classList.add('over');
    statusEl.textContent = "It's a draw!";
  }

  // --- Simple computer opponent ---
  function computerMove(){
    const valid = [];
    for(let c=0;c<COLS;c++) if(lowestEmpty(c)>=0) valid.push(c);
    // 1) win now
    for(const c of valid) if(wouldWin(c, P2)) return c;
    // 2) block opponent's win
    for(const c of valid) if(wouldWin(c, P1)) return c;
    // 3) prefer center columns, with a little randomness
    valid.sort((a,b) => Math.abs(a-3) - Math.abs(b-3));
    const best = valid.filter(c => Math.abs(c-3) === Math.abs(valid[0]-3));
    return best[Math.floor(Math.random()*best.length)];
  }
  function wouldWin(c, player){
    const r = lowestEmpty(c);
    if(r<0) return false;
    board[r][c] = player;
    const win = winningCells(r,c);
    board[r][c] = 0;
    return !!win;
  }

  // --- Controls ---
  document.getElementById('mode').addEventListener('click', e => {
    const btn = e.target.closest('button'); if(!btn) return;
    mode = btn.dataset.mode;
    [...e.currentTarget.children].forEach(b => b.classList.toggle('active', b===btn));
    newGame();
  });
  document.getElementById('reset').addEventListener('click', newGame);

  newGame();
})();
</script>
</body>
</html>
